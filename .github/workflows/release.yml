name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'  # Trigger on version tags like v1.0.0, v1.1.0, etc.

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Clean previous release output
        shell: powershell
        run: |
          if (Test-Path "./app/release") {
            Remove-Item "./app/release" -Recurse -Force
          }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Sync app version from tag
        working-directory: ./app
        shell: powershell
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          npm version $version --no-git-tag-version --allow-same-version

          $packageVersion = (Get-Content "./package.json" -Raw | ConvertFrom-Json).version
          if ($packageVersion -ne $version) {
            Write-Error "Package version $packageVersion does not match release tag $version"
            exit 1
          }

      - name: Install dependencies
        working-directory: ./app
        run: npm ci

      - name: Validate release environment
        shell: powershell
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_PAYSTACK_PUBLIC_KEY: ${{ secrets.VITE_PAYSTACK_PUBLIC_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          $required = @(
            'VITE_API_BASE_URL',
            'VITE_PAYSTACK_PUBLIC_KEY',
            'VITE_SUPABASE_URL',
            'VITE_SUPABASE_ANON_KEY'
          )

          foreach ($name in $required) {
            if ([string]::IsNullOrWhiteSpace((Get-Item "Env:$name").Value)) {
              Write-Error "Required GitHub Actions secret is missing: $name"
              exit 1
            }
          }

          if ($env:VITE_SUPABASE_URL -ne 'https://wwehdzkmoxyfkvkrascn.supabase.co') {
            Write-Error 'Release is not configured for the current Supabase project.'
            exit 1
          }

          @"
          VITE_API_BASE_URL=$env:VITE_API_BASE_URL
          VITE_PAYSTACK_PUBLIC_KEY=$env:VITE_PAYSTACK_PUBLIC_KEY
          VITE_SUPABASE_URL=$env:VITE_SUPABASE_URL
          VITE_SUPABASE_ANON_KEY=$env:VITE_SUPABASE_ANON_KEY
          "@ | Set-Content -Path './app/.env' -Encoding utf8

      - name: Build native camera binaries (cmake)
        shell: powershell
        run: |
          cmake -S native-camera -B native-camera/build -A x64
          cmake --build native-camera/build --config Release
          Write-Host "Native camera build output:"
          Get-ChildItem -Path "native-camera/build/Release" | Select-Object Name

      - name: Build app
        working-directory: ./app
        run: npm run electron:release
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_PAYSTACK_PUBLIC_KEY: ${{ secrets.VITE_PAYSTACK_PUBLIC_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Find built installer
        id: find_installer
        shell: powershell
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          $expectedInstaller = "Format-Boy CAM Desktop Setup $version.exe"

          Write-Host "Listing ./app/release folder:"
          Get-ChildItem -Path "./app/release" -Recurse | Select-Object FullName | Format-List

          $exe = Get-ChildItem -Path "./app/release" -Filter $expectedInstaller -Recurse | Select-Object -First 1
          if ($exe) {
            $relativePath = "app/release/$($exe.Name)"
            echo "exe_path=$relativePath" >> $env:GITHUB_OUTPUT
            echo "exe_name=$($exe.Name)" >> $env:GITHUB_OUTPUT
            Write-Host "Found executable: $relativePath"
          } else {
            Write-Host "Expected installer not found: $expectedInstaller"
            Get-ChildItem -Path "./app/release" -Recurse | Format-List
            exit 1
          }

      - name: Calculate SHA256
        id: sha256
        shell: powershell
        run: |
          $hash = (Get-FileHash -Path "${{ steps.find_installer.outputs.exe_path }}" -Algorithm SHA256).Hash
          echo "hash=$hash" >> $env:GITHUB_OUTPUT
          Write-Host "SHA256: $hash"

      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ steps.find_installer.outputs.exe_path }}
          body: |
            ## Format-Boy Desktop ${{ github.ref_name }}
            
            **SHA256:** `${{ steps.sha256.outputs.hash }}`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
